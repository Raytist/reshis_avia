<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D-модель района у Ходынского поля: вертипорты, трассы eVTOL, пробки, шум и маршруты">
<style>[hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Ходынка-2040</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
/* Раскладка как в Google Картах: карта на весь экран; сверху слева поиск, справа от него слои;
   под поиском карточка места или маршрута (на телефоне — шторка снизу); справа внизу компас, 2D/3D и масштаб;
   внизу сценарий, время и легенда. Компоненты из «Олимпа» (ideafix): пилюли 30px, поля и карточки 15px,
   мягкая заливка, шрифт Onest. Акцент синий, «авиационный». Одна светлая тема, как у ideafix. */
:root {
  color-scheme: light;
  --brand: #2A78D6;
  --brand-ink: #1B5CAB;
  --soft: #F2F7FD;
  --soft-2: #E2EDFA;
  --line: #C6DAF3;
  --hair: #E4ECF6;
  --ink: #0F1A2A;
  --muted: #56657A;
  --surface: #FFFFFF;
  --map: #EEF1F4;
  --metro: #D23A30;
  --bad: #B3261E;
  --route-b: #D93025;
  --seg-walk: #B9C6D6;
  --seg-wait: #DEE5EE;
  --seg-bus: #E3A21A;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --shadow: 0 1px 2px rgba(16, 52, 104, .10), 0 4px 14px rgba(16, 52, 104, .12);
  --panel-w: clamp(330px, 28vw, 392px);
  --top: calc(12px + env(safe-area-inset-top, 0px));
  --left: max(16px, env(safe-area-inset-left, 0px));
  --right: max(16px, env(safe-area-inset-right, 0px));
  --bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  --peek: 76px;
  --time-h: 100px;
}
html, body { height: 100%; }
body { margin: 0; background: var(--map); color: var(--ink); font: 14px/1.4 var(--font); overflow: hidden;
  -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
svg { display: block; }
#map { position: fixed; inset: 0; }

/* ---------- поиск ---------- */
.search { position: fixed; z-index: 20; top: var(--top); left: var(--left); width: var(--panel-w); }
.search-box { display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 4px; background: var(--surface);
  border-radius: 30px; box-shadow: var(--shadow); }
.search-box:focus-within { box-shadow: 0 0 0 2px var(--line), var(--shadow); }
.search-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font-size: 15px; padding: 0 4px; }
.search-box input::placeholder { color: var(--muted); }
.search-box .sep { width: 1px; height: 24px; background: var(--hair); margin: 0 2px; }
.icon-btn { flex-shrink: 0; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; color: var(--muted); }
.icon-btn:hover { background: var(--soft); color: var(--brand-ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.brand { color: var(--brand); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.sm svg { width: 16px; height: 16px; }
.suggest { margin-top: 6px; background: var(--surface); border: 1px solid var(--hair); border-radius: 15px; box-shadow: var(--shadow);
  max-height: min(500px, 64vh); overflow-y: auto; }
.sg-cap { padding: 10px 16px 4px; font-size: 12px; color: var(--muted); }
.sg { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 16px; text-align: left; }
.sg:hover, .sg.active { background: var(--soft); }
.sg-main { min-width: 0; display: grid; }
.sg-t { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg-m { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sg-empty { padding: 14px 16px; font-size: 13.5px; color: var(--muted); }

/* ---------- значки мест ---------- */
.pin { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  color: var(--surface); font-weight: 600; font-size: 13px; line-height: 1; }
.pin.vp { background: var(--brand); }
.pin.metro { background: var(--metro); font-size: 12px; }
.pin.plain { background: var(--soft); color: var(--brand-ink); }
.pin.plain svg { width: 16px; height: 16px; }
.dot { flex-shrink: 0; width: 12px; height: 12px; margin: 0 8px; border-radius: 50%; }

/* ---------- слои ---------- */
.chips { position: fixed; z-index: 15; top: var(--top); left: calc(var(--left) + var(--panel-w) + 12px); right: var(--right);
  height: 48px; display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 30px;
  background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--shadow); font-size: 13px; white-space: nowrap; }
.chip:hover { border-color: var(--line); }
.chip .ck { display: none; width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--soft-2); border-color: var(--brand); color: var(--brand-ink); padding-left: 10px; }
.chip[aria-pressed="true"] .ck { display: block; }

/* ---------- карточка места ---------- */
.panel { position: fixed; z-index: 10; top: calc(var(--top) + 60px); left: var(--left); width: var(--panel-w);
  max-height: calc(100% - var(--top) - 60px - var(--bottom)); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--hair); border-radius: 15px; box-shadow: var(--shadow);
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.handle { display: none; }
.pbody { padding: 16px 18px 18px; display: grid; gap: 14px; }
.phead { display: flex; align-items: flex-start; gap: 6px; }
.phead .icon-btn { margin: -6px 0 0 -10px; }
.ptitle { margin: 0; font-size: 20px; line-height: 24px; font-weight: 500; letter-spacing: -.005em; text-wrap: balance; }
.psub { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 4px; }
.act { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 5px; padding: 4px 2px; font-size: 12px; color: var(--brand-ink); }
.act .ring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); }
.act .ring svg { width: 18px; height: 18px; }
.act:hover .ring { background: var(--soft); }
.act.primary .ring, .act[aria-pressed="true"] .ring { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.facts { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.facts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.facts svg { width: 20px; height: 20px; color: var(--brand); margin-top: 1px; }
.f-t { font-size: 14px; }
.f-m { margin-top: 1px; font-size: 12.5px; color: var(--muted); }
.bad .f-t { color: var(--bad); }
.list { display: grid; gap: 2px; }
.list h2 { margin: 0 0 4px; font-size: 15px; line-height: 20px; font-weight: 500; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 6px; text-align: left; border-radius: 12px; }
.row:hover { background: var(--soft); }
.r-main { flex: 1; min-width: 0; display: grid; }
.r-t { font-size: 14px; }
.r-m { font-size: 12px; color: var(--muted); }
.row .chev { flex-shrink: 0; width: 18px; height: 18px; color: var(--brand); }
.foot { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- маршрут ---------- */
.eps { position: relative; display: grid; gap: 6px; padding-right: 40px; }
.ep { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 6px 4px 6px 14px; background: var(--soft); border-radius: 15px; }
.ep-dot { flex-shrink: 0; width: 12px; height: 12px; border-radius: 50%; }
.ep-dot.a { background: var(--surface); box-shadow: inset 0 0 0 3px var(--ink); }
.ep-dot.b { background: var(--route-b); }
.ep-main { flex: 1; min-width: 0; display: grid; }
.ep-t { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-m { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep.empty .ep-t { color: var(--muted); }
.ep.empty .ep-m { white-space: normal; }
.eps .swap { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
.verdict { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 13.5px; }
.modes { display: grid; gap: 2px; }
.mode { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; grid-template-areas: "ic nm tm" ". sb sb" ". br br";
  gap: 3px 12px; align-items: center; padding: 10px 8px; border-radius: 12px; }
.mode.best { background: var(--soft); }
.mode > svg { grid-area: ic; width: 20px; height: 20px; color: var(--brand); }
.m-name { grid-area: nm; font-size: 14px; font-weight: 500; }
.m-time { grid-area: tm; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.m-sub { grid-area: sb; font-size: 12px; color: var(--muted); }
.m-bar { grid-area: br; display: flex; gap: 2px; height: 6px; }
.m-bar i { display: block; height: 100%; border-radius: 3px; min-width: 2px; }
.mode.na .m-name, .mode.na .m-time { color: var(--muted); }
.s-walk { background: var(--seg-walk); }
.s-wait { background: var(--seg-wait); }
.s-bus { background: var(--seg-bus); }
.s-car { background: var(--brand); }
.s-fly { background: var(--brand-ink); }
.best-tag { margin-left: 6px; padding: 1px 8px; border-radius: 30px; font-size: 11px; font-weight: 500; color: var(--brand-ink); background: var(--soft-2); }
.seg-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.seg-key span { display: inline-flex; align-items: center; gap: 5px; }
.seg-key i { display: inline-block; width: 14px; height: 6px; border-radius: 3px; }

/* ---------- кнопки камеры ---------- */
.ctrl { position: fixed; z-index: 9; right: var(--right); bottom: var(--bottom); display: grid; gap: 8px; justify-items: end; }
.cbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface);
  box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--ink); }
.cbtn:hover { color: var(--brand-ink); background: var(--soft); }
.cbtn svg { width: 22px; height: 22px; }
.zoom { display: grid; background: var(--surface); border-radius: 30px; box-shadow: var(--shadow); overflow: hidden; }
.zoom button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); }
.zoom button:hover { background: var(--soft); color: var(--brand-ink); }
.zoom button + button { border-top: 1px solid var(--hair); }
.zoom svg { width: 20px; height: 20px; }

/* ---------- сценарий, время, легенда ---------- */
.timebar { position: fixed; z-index: 8; bottom: var(--bottom); left: calc(var(--left) + var(--panel-w) + 16px); right: calc(var(--right) + 56px);
  display: flex; justify-content: center; pointer-events: none; }
.tcard { pointer-events: auto; width: min(620px, 100%); background: var(--surface); border: 1px solid var(--hair); border-radius: 15px;
  box-shadow: var(--shadow); padding: 10px 12px; display: grid; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--soft); border-radius: 30px; }
.seg button { height: 32px; border-radius: 30px; font-size: 13px; white-space: nowrap; padding: 0 8px; }
.seg button:hover { background: rgba(255, 255, 255, .6); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-ink); box-shadow: 0 1px 3px rgba(42, 120, 214, .18); }
.trow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.play { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--surface); }
.play svg { width: 16px; height: 16px; }
.play:hover { background: var(--brand-ink); }
.clock { flex-shrink: 0; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 2.9em; }
#scrub { flex: 1; min-width: 60px; accent-color: var(--brand); }
.snote { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend:empty { display: none; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; }
.ramp { display: inline-flex; gap: 2px; }
.ramp i { width: 14px; height: 6px; }

.tip { position: fixed; z-index: 30; pointer-events: none; max-width: 260px; padding: 6px 10px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--hair); border-radius: 10px; box-shadow: var(--shadow); font-size: 12.5px; }
.loading { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--map); color: var(--muted); font-size: 14px; }

/* ---------- телефон: шторка снизу ---------- */
@media (max-width: 759px) {
  .search { right: var(--right); width: auto; }
  .chips { top: calc(var(--top) + 56px); left: 0; right: 0; height: 42px; padding: 0 var(--right) 0 var(--left); }
  .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 86vh; height: 86dvh; max-height: none; border-radius: 15px 15px 0 0;
    border-bottom: 0; transform: translateY(calc(86vh - var(--peek) - env(safe-area-inset-bottom, 0px)));
    transform: translateY(calc(86dvh - var(--peek) - env(safe-area-inset-bottom, 0px))); transition: transform .25s ease; z-index: 12;
    padding-left: var(--left); padding-right: var(--right); }
  body[data-sheet="half"] .panel { transform: translateY(40vh); transform: translateY(40dvh); }
  body[data-sheet="full"] .panel { transform: none; }
  .handle { display: grid; place-items: center; position: sticky; top: 0; z-index: 1; width: 100%; height: 22px; background: var(--surface); }
  .handle::before { content: ""; width: 40px; height: 4px; border-radius: 4px; background: var(--line); }
  .pbody { padding: 2px 2px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .timebar { left: var(--left); right: var(--right); bottom: calc(var(--peek) + env(safe-area-inset-bottom, 0px) + 8px); }
  .tcard { width: 100%; padding: 8px 10px; gap: 6px; }
  .snote, .legend { display: none; }
  .seg button { font-size: 12.5px; padding: 0 4px; }
  .ctrl { bottom: calc(var(--peek) + env(safe-area-inset-bottom, 0px) + 16px + var(--time-h)); }
  .ctrl .zoom { display: none; }
  .tip { display: none; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>

<div id="map" role="application" aria-label="3D-карта района у Ходынского поля с вертипортами и трассами eVTOL"></div>
<div class="loading" id="loading">Загружаю модель района…</div>

<div class="search" id="search">
  <div class="search-box">
    <button class="icon-btn" id="home" aria-label="Карточка района"></button>
    <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Поиск: вертипорт, улица, дом" autocomplete="off" aria-label="Поиск по модели" aria-controls="suggest">
    <button class="icon-btn" id="clear" aria-label="Очистить поиск" hidden></button>
    <span class="icon-btn" id="qicon" aria-hidden="true"></span>
    <span class="sep" aria-hidden="true"></span>
    <button class="icon-btn brand" id="routeBtn" aria-label="Маршрут" title="Маршрут"></button>
  </div>
  <div class="suggest" id="suggest" role="listbox" hidden></div>
</div>

<div class="chips" id="chips" role="group" aria-label="Слои карты">
  <button class="chip" data-l="traffic">Пробки</button>
  <button class="chip" data-l="corr">Трассы eVTOL</button>
  <button class="chip" data-l="flights">Полёты</button>
  <button class="chip" data-l="cars">Машины</button>
  <button class="chip" data-l="noise">Шум</button>
  <button class="chip" data-l="zones">Зоны</button>
</div>

<aside class="panel" id="panel" aria-label="Карточка места">
  <div class="handle" id="handle" role="button" tabindex="0" aria-label="Развернуть карточку"></div>
  <div class="pbody" id="pbody"></div>
</aside>

<div class="ctrl" id="ctrl">
  <button class="cbtn" id="compass" aria-label="Повернуть на север"></button>
  <button class="cbtn" id="tilt" aria-label="Вид сверху">2D</button>
  <div class="zoom">
    <button id="zin" aria-label="Приблизить"></button>
    <button id="zout" aria-label="Отдалить"></button>
  </div>
</div>

<div class="timebar" id="timebar">
  <div class="tcard">
    <div class="seg" id="seg" role="group" aria-label="Сценарий">
      <button data-s="limit">На пределе</button>
      <button data-s="price">Билет 400 ₽</button>
      <button data-s="day">Обычный день</button>
    </div>
    <div class="trow">
      <button class="play" id="play" aria-label="Пауза"></button>
      <span class="clock" id="clock">8:00</span>
      <input id="scrub" type="range" min="0" max="3590" step="10" value="0" aria-label="Время в течение часа">
    </div>
    <div class="snote" id="snote"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.38/dist.min.js"></script>
<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  // ---------- значки (24×24, линия 1.8) ----------
  const svg = (d, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? "currentColor" : "none"}" stroke="${fill ? "none" : "currentColor"}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = {
    search: svg('<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>'),
    menu: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
    close: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
    back: svg('<path d="M15 5l-7 7 7 7"/>'),
    chev: svg('<path d="m9 6 6 6-6 6"/>'),
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    minus: svg('<path d="M5 12h14"/>'),
    play: svg('<path d="M8 5.5v13l11-6.5z"/>', true),

    compass: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 15 12H9z" fill="#D23A30"/><path d="M12 21 9 12h6z" fill="#9AA6B6"/></svg>',
    people: svg('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.3.2 3.9 1.7 4.5 4.3"/>'),
    trips: svg('<path d="M4 8h13l-3-3M20 16H7l3 3"/>'),
    walk: svg('<circle cx="13" cy="4.5" r="1.8"/><path d="m10 21 2-6 3 3v3M8.5 11l2.5-3.5 3.5 1 2 3.5M11 7.5 10 14"/>'),
    bus: svg('<rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 10.5h14M8 17.5V20M16 17.5V20"/><circle cx="8.5" cy="14" r=".9" fill="currentColor"/><circle cx="15.5" cy="14" r=".9" fill="currentColor"/>'),
    car: svg('<path d="M4.5 16.5v-4l2.2-5h10.6l2.2 5v4M3.5 16.5h17M7 12.5h10"/><circle cx="7.5" cy="16.8" r="1.7"/><circle cx="16.5" cy="16.8" r="1.7"/>'),
    clock: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
    ticket: svg('<path d="M4 7.5h16v3a2 2 0 0 0 0 3v3H4v-3a2 2 0 0 0 0-3z"/><path d="M14 7.5v9" stroke-dasharray="1.5 2"/>'),
    pad: svg('<circle cx="12" cy="12" r="8.5"/><path d="M9 8v8M15 8v8M9 12h6"/>'),
    noise: svg('<path d="M4 10v4h3.5L12 18V6L7.5 10z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),

    out.push(new deck.PolygonLayer({ id: "bld", data: D.buildings, getPolygon: (d) => d.p, extruded: true, getElevation: (d) => d.h,

    out.push(new deck.TextLayer({ id: "streets", data: D.slabels, getPosition: (d) => [d.c[0], d.c[1], 0.5], getText: (d) => d.t,
      getAngle: (d) => d.a, billboard: false, sizeUnits: "meters", getSize: 17, sizeMaxPixels: 14, getColor: MAP.label, fontWeight: 500,

      getText: (d) => `${d.id} · ${d.short}`, getSize: 13, getColor: (d) => darker(d.col), fontWeight: 600, ...text, ...halo, outlineWidth: 4 }));
    out.push(...routeLayers(text));
    out.push(new deck.ScatterplotLayer({ id: "metro", data: D.stations, getPosition: (d) => [d.c[0], d.c[1], 4], getRadius: 9,
      radiusUnits: "pixels", getFillColor: MAP.metro, stroked: true, getLineColor: [255, 255, 255], getLineWidth: 2, lineWidthUnits: "pixels",

    out.push(new deck.TextLayer({ id: "metro-m", data: D.stations, getPosition: (d) => [d.c[0], d.c[1], 4], getText: () => "М", getSize: 10.5,

    out.push(new deck.ScatterplotLayer({ id: "vp", data: D.vertiports, getPosition: (d) => [d.c[0], d.c[1], d.z + 2],
      getRadius: (d) => isSel("vp", d.id) ? 15 : 12, radiusUnits: "pixels", getFillColor: MAP.vp, stroked: true, getLineColor: [255, 255, 255],
      getLineWidth: 2.5, lineWidthUnits: "pixels", billboard: true, pickable: true, parameters: FLAT, updateTriggers: { getRadius: selKey() } }));
    out.push(new deck.TextLayer({ id: "vp-h", data: D.vertiports, getPosition: (d) => [d.c[0], d.c[1], d.z + 2], getText: () => "H",
      getSize: (d) => isSel("vp", d.id) ? 14 : 12, getColor: [255, 255, 255], fontWeight: 600, ...text, updateTriggers: { getSize: selKey() } }));
    // подпись вертипорта — на белой плашке, чтобы читалась и над площадками, и над домами;
    // V1 стоит рядом со станциями «Полежаевская» и «Хорошёвская», поэтому его подпись слева
    out.push(new deck.TextLayer({ id: "vp-l", data: D.vertiports, getPosition: (d) => [d.c[0], d.c[1], d.z + 2], getText: (d) => `${d.id} ${d.short}`,
      // на телефоне V1 у самого левого края экрана, поэтому там его подпись над значком
      getSize: 12.5, getColor: MAP.vpInk,
      getPixelOffset: (d) => d.id !== "V1" ? [20, 0] : mobileQ.matches ? [0, -24] : [-20, 0],
      getTextAnchor: (d) => d.id !== "V1" ? "start" : mobileQ.matches ? "middle" : "end",
      getAlignmentBaseline: "center", fontWeight: 600, ...text, background: true, getBackgroundColor: [255, 255, 255, 240],
      backgroundPadding: [6, 3], getBorderColor: [198, 218, 243, 255], getBorderWidth: 1,
      updateTriggers: { getPixelOffset: mobileQ.matches, getTextAnchor: mobileQ.matches } }));
    return out;
  }

  // ---------- камера ----------
  function visibleRect() {
    const Wd = innerWidth, H = innerHeight;
    let left = 0, right = Wd, top, bottom;
    if (mobileQ.matches) {
      top = $("#chips").getBoundingClientRect().bottom + 6;
      const sheetTop = state.sheet === "half" ? H * 0.54 : state.sheet === "full" ? H * 0.14 : $("#timebar .tcard").getBoundingClientRect().top;
      bottom = sheetTop - 8;
    } else {
      top = $("#search").getBoundingClientRect().bottom + 8;
      left = $("#panel").getBoundingClientRect().right + 8;
      right = $("#ctrl").getBoundingClientRect().left - 8;
      bottom = $("#timebar .tcard").getBoundingClientRect().top - 8;
    }
    if (right - left < 160) { left = 0; right = Wd; }
    if (bottom - top < 160) { top = 0; bottom = H; }
    return { left, right, top, bottom };
  }
  let deckgl = null;
  function view() {
    const v = deckgl && deckgl.getViewports()[0];
    return v ? { longitude: v.longitude, latitude: v.latitude, zoom: v.zoom, pitch: v.pitch, bearing: v.bearing } : null;
  }
  // центр карты, при котором точка lngLat окажется в середине свободной от панелей части экрана
  function framed(lngLat, zoom, pitch, bearing) {
    const Wd = innerWidth, H = innerHeight, r = visibleRect();
    const vp = new deck.WebMercatorViewport({ width: Wd, height: H, longitude: lngLat[0], latitude: lngLat[1], zoom, pitch, bearing });
    const pos = [(r.left + r.right) / 2, (r.top + r.bottom) / 2];
    const c = vp.unproject([Wd - pos[0], H - pos[1]]);
    return { longitude: c[0], latitude: c[1], zoom, pitch, bearing };
  }
  function flyTo(v, mode) {
    const instant = reduce || mode === "instant";
    deckgl.setProps({ initialViewState: { ...v, transitionDuration: instant ? 0 : mode === "quick" ? 250 : 1100,
      transitionInterpolator: mode === "quick" ? new deck.LinearInterpolator(["longitude", "latitude", "zoom", "pitch", "bearing"]) : new deck.FlyToInterpolator() } });
  }
  // масштаб, при котором прямоугольник из точек помещается в свободную часть экрана (для повёрнутой камеры — с запасом)
  function fitZoom(pts, fallback, bearingDeg) {
    const Wd = innerWidth, H = innerHeight, r = visibleRect();
    const lons = pts.map((q) => q[0]), lats = pts.map((q) => q[1]);
    try {
      const fit = new deck.WebMercatorViewport({ width: Wd, height: H }).fitBounds(
        [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
        { padding: { left: r.left + 24, right: Wd - r.right + 24, top: r.top + 24, bottom: H - r.bottom + 24 } });
      const b = Math.abs(bearingDeg) * Math.PI / 180;
      return fit.zoom - Math.log2(Math.abs(Math.cos(b)) + Math.abs(Math.sin(b)));
    } catch (e) { return fallback; }
  }
  function overviewState() {
    const zoom = fitZoom(D.square, 14.4, 20) - (mobileQ.matches ? 0.3 : 0.05);
    return framed(D.center, zoom, 50, -20);
  }
  function fitRoute(mode) {
    const { a, b } = state.route;
    if (!a || !b) return;
    const R = calcRoute(a, b);
    const pts = [a.c, b.c, ...(R.air ? [R.air.va.c, R.air.vb.c] : [])];
    const cur = view(), bearing = cur ? cur.bearing : -20;
    const zoom = Math.min(16.6, fitZoom(pts, 15, bearing) - 0.3);
    const lons = pts.map((q) => q[0]), lats = pts.map((q) => q[1]);
    flyTo(framed([(Math.min(...lons) + Math.max(...lons)) / 2, (Math.min(...lats) + Math.max(...lats)) / 2], zoom, 40, bearing), mode);
  }
  function selTarget() {
    const s = state.sel;
    if (!s) return D.center;
    return s.type === "vp" ? VPS[s.id].c : s.type === "st" ? STN[s.id].c : s.type === "zone" ? ZN[s.id].c : s.type === "bld" ? s.obj.ct : s.at;
  }
  function focusSel(mode) {
    const s = state.sel, cur = view();
    if (!s) return flyTo(overviewState(), mode);
    const keep = cur ? cur.bearing : -20;
    const z = { vp: [16.8, 55], st: [16.5, 45], zone: [15.4, 40], bld: [17.2, 50], road: [16.3, 45] }[s.type];
    flyTo(framed(selTarget(), z[0], z[1], keep), mode);
  }

  // ---------- карточки ----------

  const routeActs = () => `${act("from", IC.from, "Отсюда")}${act("to", IC.to, "Сюда")}`;

  function homeHTML() {
    const s = S.rush, d = S.day;

        ${fact(IC.ticket, `При билете 400 ₽ летят ${s.air_want} ${form(s.air_want, W_.man)} в час`, `если полёт бесплатный — ${s.free_want}, ждать в среднем ${s.free_wait} мин`)}

        ${fact(IC.noise, `Без превышения шума — до ${S.noise_safe} полётов в час`, `при ${S.flights.limit} ${form(S.flights.limit, W_.flP)} в час выше 55 дБА днём у ${fmt(S.noise_day55)} ${form(S.noise_day55, W_.resG)}`, true)}
      </ul>

      <p class="foot">Здания, улицы и парки — © участники OpenStreetMap. Спрос — гравитационная модель, машины распределены по сети с пробками, вертипорты посчитаны посекундной симуляцией. С 1910 по 2003 год на Ходынском поле работал Центральный аэродром.</p>`;
  }
  function vpHTML(v) {
    const zs = v.zones.map((z) => `${z} — ${esc(ZN[z].short)}`).join(", ");
    return head(v.name, `Вертипорт ${v.id} · ${v.roof ? "на крыше" : "наземный"} · 2 площадки 30×30 м`, "home") +
      `<div class="actions">${act("focus", IC.target, "Показать", { primary: true })}${routeActs()}${act("noise", IC.noise, "Шум", { pressed: state.layers.noise })}</div>
      <ul class="facts">

        ${fact(IC.ticket, `По цене 400 ₽ — ${v.dep_price} ${form(v.dep_price, W_.dep)} в час пик`, `если полёт бесплатный, площадки заняты ${v.util_free}% времени`)}

  function zoneHTML(z) {

  function stHTML(s) {

  function bldHTML(b) {

  function roadHTML(r) {

        ${fact(IC.clock, `Днём: загрузка ${dec(r.vn, 2)} — ${level(r.vn)}`)}
        ${fact(IC.car, `В час пик ≈ ${fmt(r.vr * r.cap)} машин в час`, `фоновое движение ≈ ${fmt(r.br)}, машины жителей района ≈ ${fmt(Math.max(0, r.vr * r.cap - r.br))}; дорога пропускает ≈ ${fmt(r.cap)} в час`)}
        ${fact(IC.car, `Днём ≈ ${fmt(r.vn * r.cap)} машин в час`, `фоновое движение ≈ ${fmt(r.bn)}, машины жителей ≈ ${fmt(Math.max(0, r.vn * r.cap - r.bn))}`)}
      </ul>`;
  }
  function routeHTML() {
    const { a, b } = state.route;
    const ep = (e, role) => e
      ? `<div class="ep"><span class="ep-dot ${role}"></span><span class="ep-main"><span class="ep-t">${esc(e.name)}</span><span class="ep-m">${esc(e.sub)}</span></span><button class="icon-btn sm" data-act="clear-${role}" aria-label="Убрать точку">${IC.close}</button></div>`
      : `<div class="ep empty"><span class="ep-dot ${role}"></span><span class="ep-main"><span class="ep-t">${role === "a" ? "Откуда" : "Куда"}</span><span class="ep-m">нажмите на дом на карте или найдите место в поиске</span></span></div>`;
    let body = "";
    if (a && b) {
      const R = calcRoute(a, b);
      if (R.d < 40) body = `<p class="verdict">Точки почти совпадают — выберите другое место.</p>`;
      else {
        const ok = R.modes.filter((m) => !m.na);
        const best = ok.reduce((x, y) => (y.t < x.t ? y : x));
        const ground = ok.filter((m) => m.k !== "air").reduce((x, y) => (y.t < x.t ? y : x));
        const tmax = Math.max(...ok.map((m) => m.t));
        const GEN = { walk: "пешком", bus: "автобуса", car: "машины" };
        let verdict;
        if (!R.air) verdict = `Быстрее всего — ${best.name.toLowerCase()}: ${mins(best.t)} мин. eVTOL здесь не поможет: ${R.modes[3].na}.`;
        else {
          const diff = Math.round((R.air.t - ground.t) / 60);
          verdict = diff > 0
            ? `Быстрее всего — ${ground.name.toLowerCase()}: ${mins(ground.t)} мин. Полёт займёт ${mins(R.air.t)} мин, на ${diff} мин дольше.`
            : diff < 0 ? `Полёт быстрее ${GEN[ground.k] === "пешком" ? "ходьбы" : GEN[ground.k]} на ${-diff} мин: ${mins(R.air.t)} мин против ${mins(ground.t)}, но билет стоит 400 ₽.`
            : `Полёт и ${ground.name.toLowerCase()} занимают одинаково — по ${mins(ground.t)} мин.`;
        }
        const segClass = { walk: "s-walk", wait: "s-wait", bus: "s-bus", car: "s-car", fly: "s-fly" };
        const rows = R.modes.map((m) => m.na
          ? `<div class="mode na">${m.icon}<span class="m-name">${m.name}</span><span class="m-time">—</span><span class="m-sub">${esc(m.na)}</span></div>`
          : `<div class="mode${m === best ? " best" : ""}">${m.icon}<span class="m-name">${m.name}${m === best ? '<span class="best-tag">быстрее всего</span>' : ""}</span><span class="m-time">${mins(m.t)} мин</span>
             <span class="m-sub">${m.cost ? `${m.cost} ₽ · ${dec(m.kwh, 2)} кВт·ч на человека` : "бесплатно, без затрат энергии"} · ${esc(m.sub)}</span>
             <span class="m-bar" style="width:${Math.max(6, 100 * m.t / tmax)}%">${m.seg.map(([k, t]) => `<i class="${segClass[k]}" style="flex:${t}"></i>`).join("")}</span></div>`).join("");
        const sc = SC[state.scen];
        const fw = Math.round((sc.rush ? PRM.free_wait_rush : PRM.free_wait_day) / 60);
        body = `<p class="verdict">${verdict}</p><div class="modes">${rows}</div>
          <div class="seg-key"><span><i class="s-walk"></i>пешком</span><span><i class="s-wait"></i>ожидание, досмотр</span><span><i class="s-bus"></i>автобус</span><span><i class="s-car"></i>машина</span><span><i class="s-fly"></i>полёт</span></div>
          <p class="foot">Те же формулы, что в модели: пешком ${dec(PRM.walk_v, 2)} м/с с обходами, машина и автобус — со средней скоростью модели (${sc.rush ? "час пик" : "день"}), eVTOL — по прямой трассе, без очереди на площадке. Если полёт бесплатный, ждать в среднем ${fw} мин. Энергия — на одного человека: 1,3 человека в машине, 2 — в eVTOL.</p>`;
      }
    }
    return head("Маршрут", "Время «от двери до двери» пешком, на автобусе, на машине и на eVTOL", "route-close") +
      `<div class="eps">${ep(a, "a")}${ep(b, "b")}${a || b ? `<button class="icon-btn swap" data-act="swap" aria-label="Поменять местами">${IC.swap}</button>` : ""}</div>${body}`;
  }
  function renderPanel() {
    const s = state.sel;
    let html = homeHTML();
    if (state.route.open) html = routeHTML();
    else if (s) {
      if (s.type === "vp") html = vpHTML(VPS[s.id]);
      else if (s.type === "zone") html = zoneHTML(ZN[s.id]);
      else if (s.type === "st") html = stHTML(STN[s.id]);
      else if (s.type === "bld") html = bldHTML(s.obj);
      else if (s.type === "road") html = roadHTML(s.obj);
    }
    $("#pbody").innerHTML = html;
    $("#panel").scrollTop = 0;
  }
  function setSheet(st) {
    state.sheet = st;
    document.body.dataset.sheet = st;
    $("#handle").setAttribute("aria-label", st === "full" ? "Свернуть карточку" : "Развернуть карточку");
  }
  // ссылка на место: #V2, #Z5 — её можно отправить, и карточка откроется сразу
  const HASHABLE = /^(V[1-3]|Z[1-6]|route)$/;
  function setHash() {
    const s = state.sel;
    const h = state.route.open ? "route" : s && (s.type === "vp" || s.type === "zone") ? s.id : "";
    try {
      if (h && location.hash !== "#" + h) location.hash = h;
      else if (!h && location.hash) history.replaceState(null, "", location.pathname + location.search);
    } catch (e) { /* в некоторых окнах адрес менять нельзя — карточка всё равно открыта */ }
  }
  function select(sel, fly) {
    state.sel = sel;
    state.route.open = false;
    renderPanel();
    // на телефоне: выбор из списка или поиска открывает шторку наполовину, тап по карте — только заголовок
    if (mobileQ.matches && sel) setSheet(fly ? "half" : "peek");
    refresh();
    setHash();
    if (fly) focusSel();
  }
  function openRoute(fill) {
    if (fill === "example" || (!state.route.a && !state.route.b && !fill)) exampleRoute();
    state.route.open = true;
    renderPanel();
    if (mobileQ.matches) setSheet("half");
    refresh();
    setHash();
    fitRoute();
  }
  function setEndpoint(role, e) {
    if (!e) return;
    state.route[role] = e;
    state.route.open = true;
    renderPanel();
    if (mobileQ.matches) setSheet("half");
    refresh();
    setHash();
    if (state.route.a && state.route.b) fitRoute();
  }
  function parseKey(key) {
    const i = key.indexOf(":"), type = key.slice(0, i), id = key.slice(i + 1);
    if (type === "road") {
      const r = bestRoad[id];
      return r && { type: "road", obj: r, at: r.p[Math.floor(r.p.length / 2)] };
    }
    if (type === "bld") { const b = D.buildings[+id]; return b && { type: "bld", obj: b }; }
    return { type, id };
  }
  // в режиме маршрута клик по карте или выбор в поиске ставит точку: сначала «Откуда», потом «Куда»
  function pickPlace(sel, fly) {
    if (state.route.open) setEndpoint(state.route.a ? "b" : "a", endpointOf(sel));
    else select(sel, fly);
  }

  // ---------- поиск ----------
  const norm = (s) => s.toLowerCase().replace(/ё/g, "е").replace(/[«»"()]/g, " ").replace(/\s+/g, " ").trim();
  const ITEMS = [
    ...D.vertiports.map((v) => ({ key: "vp:" + v.id, t: `${v.id} · ${v.name}`, m: `вертипорт ${v.roof ? "на крыше" : "наземный"}`, pin: '<span class="pin vp">H</span>' })),
    ...D.stations.map((s) => ({ key: "st:" + s.n, t: s.n, m: "станция метро", pin: '<span class="pin metro">М</span>' })),
    ...D.zlabels.map((z) => ({ key: "zone:" + z.id, t: `${z.id} · ${z.name}`, m: zoneTitle(z).toLowerCase(), pin: `<span class="dot" style="background:rgb(${z.col.join(",")})"></span>` })),
  ];
  Object.entries(bestRoad).forEach(([n, r]) => ITEMS.push({ key: "road:" + n, t: n, m: (ROADK[r.k] || "улица").toLowerCase(), pin: `<span class="pin plain">${IC.road}</span>` }));
  const seenB = new Set();
  D.buildings.forEach((b, i) => { if (b.n && !seenB.has(b.n)) { seenB.add(b.n); ITEMS.push({ key: "bld:" + i, t: b.n, m: [KIND[b.k], b.a].filter(Boolean).join(" · ").toLowerCase(), pin: `<span class="pin plain">${IC.building}</span>` }); } });
  ITEMS.forEach((it) => { it.n = norm(it.t + " " + it.m); });
  let sugg = [], active = -1;
  const q = $("#q"), box = $("#suggest");
  function renderSuggest() {
    const words = norm(q.value).split(" ").filter(Boolean);
    $("#clear").hidden = !q.value;
    sugg = words.length ? ITEMS.filter((it) => words.every((w) => it.n.includes(w))).slice(0, 8) : ITEMS.slice(0, 6);
    active = -1;
    const cap = state.route.open ? `Выберите точку «${state.route.a ? "Куда" : "Откуда"}»` : "Места модели";
    box.innerHTML = (words.length ? "" : `<div class="sg-cap">${cap}</div>`) +
      (sugg.length ? sugg.map((it, i) => `<button class="sg" role="option" data-i="${i}">${it.pin}<span class="sg-main"><span class="sg-t">${esc(it.t)}</span><span class="sg-m">${esc(it.m)}</span></span></button>`).join("")
        : '<div class="sg-empty">Ничего не нашлось. Попробуйте название улицы, вертипорта или станции метро.</div>');
    box.hidden = false;
  }
  function pick(i) {
    const it = sugg[i];
    if (!it) return;
    const sel = parseKey(it.key);
    box.hidden = true; q.blur();
    if (state.route.open) { q.value = ""; $("#clear").hidden = true; } else { q.value = it.t; $("#clear").hidden = false; }
    if (sel) pickPlace(sel, true);
  }
  q.addEventListener("focus", renderSuggest);
  q.addEventListener("input", renderSuggest);
  q.addEventListener("keydown", (e) => {
    const items = box.querySelectorAll(".sg");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!items.length) return;
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((el, k) => el.classList.toggle("active", k === active));
      items[active].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") { e.preventDefault(); pick(active >= 0 ? active : 0); }
    else if (e.key === "Escape") { box.hidden = true; q.blur(); }
  });
  box.addEventListener("mousedown", (e) => e.preventDefault());
  box.addEventListener("click", (e) => { const b = e.target.closest(".sg"); if (b) pick(+b.dataset.i); });
  q.addEventListener("blur", () => setTimeout(() => { box.hidden = true; }, 120));
  $("#clear").addEventListener("click", () => { q.value = ""; $("#clear").hidden = true; q.focus(); renderSuggest(); });
  $("#home").addEventListener("click", () => { q.value = ""; $("#clear").hidden = true; select(null, false); if (mobileQ.matches) setSheet("half"); });
  $("#routeBtn").addEventListener("click", () => {
    if (state.sel && !state.route.open) { state.route.b = endpointOf(state.sel); state.route.a = state.route.a && state.route.a !== state.route.b ? state.route.a : null; }
    openRoute(state.route.a || state.route.b ? "keep" : null);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    else if (e.key === "Escape" && document.activeElement !== q && (state.sel || state.route.open)) select(null, false);
  });

  // ---------- слои, сценарии, время ----------
  function syncControls() {
    document.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(!!state.layers[b.dataset.l])));
    document.querySelectorAll("#seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === state.scen)));
    document.querySelectorAll('[data-act="noise"],[data-act="zones"],[data-act="traffic"]').forEach((b) => b.setAttribute("aria-pressed", String(!!state.layers[b.dataset.act])));
    $("#snote").textContent = SC[state.scen].note;
    const L = state.layers, parts = [];
    const sw = (c) => `<i style="background:rgb(${c.join(",")})"></i>`;
    if (L.traffic) parts.push(`<span class="lg">Пробки: свободно <span class="ramp">${MAP.traffic.map(sw).join("")}</span> стоят</span>`);
    if (L.flights) parts.push(`<span class="lg">${sw(MAP.fl)}eVTOL</span><span class="lg">${sw(MAP.dead)}пустой перегон</span>`);
    if (L.cars) parts.push(`<span class="lg">${sw(MAP.car)}машины жителей</span><span class="lg">${sw(MAP.carBg)}фоновое движение: транзит, такси, развоз</span><span class="lg">1 точка — ${CAR_SCALE} машин</span>`);
    if (L.noise) {
      parts.push(`<span class="lg">Шум eVTOL за день <span class="ramp">${NOISE_BINS.map(([, c]) => sw(c)).join("")}</span> 45 → 65+ дБА, норма у жилья 55</span>`);
      if (state.scen !== "limit") parts.push(`<span class="lg">Полётов мало: у домов не громче ${S.noise_price_max} дБА, поэтому шума почти не видно. Его видно в сценарии «На пределе».</span>`);
    }
    $("#legend").innerHTML = parts.join("");
    $("#play").innerHTML = state.playing ? IC.pause : IC.play;
    $("#play").setAttribute("aria-label", state.playing ? "Пауза" : "Пуск");
  }
  function refresh() { if (deckgl) deckgl.setProps({ layers: layers() }); }
  function toggleLayer(k) { state.layers[k] = !state.layers[k]; syncControls(); refresh(); }
  document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => toggleLayer(b.dataset.l)));
  document.querySelectorAll("#seg button").forEach((b) => b.addEventListener("click", () => {
    state.scen = b.dataset.s; syncControls(); showTime(); refresh();
    // время в пути и шум у дома зависят от сценария
    if (state.route.open || (state.sel && state.sel.type === "bld")) renderPanel();
  }));
  const scrub = $("#scrub"), clock = $("#clock");
  function showTime() {
    const m = Math.floor(state.t / 60);
    clock.textContent = `${SC[state.scen].h0}:${String(m).padStart(2, "0")}`;
    scrub.value = state.t;
  }
  $("#play").addEventListener("click", () => { state.playing = !state.playing; syncControls(); });
  scrub.addEventListener("input", () => { state.t = +scrub.value; showTime(); refresh(); });

  $("#pbody").addEventListener("click", (e) => {
    const s = e.target.closest("[data-sel]");
    if (s) { const sel = parseKey(s.dataset.sel); if (sel) select(sel, true); return; }
    const a = e.target.closest("[data-act]");
    if (!a) { if (mobileQ.matches && state.sheet === "peek" && e.target.closest(".phead")) setSheet("half"); return; }
    const k = a.dataset.act;
    if (k === "home") { select(null, false); if (mobileQ.matches) setSheet("half"); }
    else if (k === "overview") { if (mobileQ.matches) setSheet("peek"); flyTo(overviewState()); }
    else if (k === "focus") { if (mobileQ.matches) setSheet("half"); focusSel(); }
    else if (k === "top") { if (mobileQ.matches) setSheet("peek"); const cur = view(); flyTo(framed(selTarget(), state.sel ? Math.max(cur.zoom, 16) : overviewState().zoom, 0, 0)); }
    else if (k === "noise" || k === "zones" || k === "traffic") { toggleLayer(k); renderPanel(); }
    else if (k === "route") openRoute("example");
    else if (k === "from" || k === "to") setEndpoint(k === "from" ? "a" : "b", endpointOf(state.sel));
    else if (k === "clear-a" || k === "clear-b") { state.route[k.slice(-1)] = null; renderPanel(); refresh(); }
    else if (k === "swap") { const t = state.route.a; state.route.a = state.route.b; state.route.b = t; renderPanel(); refresh(); }
    else if (k === "route-close") { state.route.open = false; renderPanel(); refresh(); setHash(); }
  });

  // шторка на телефоне: тап — следующее положение, свайп — вверх или вниз
  const ORDER = ["peek", "half", "full"];
  let dragY = null;
  const handle = $("#handle");
  handle.addEventListener("pointerdown", (e) => { dragY = e.clientY; });
  handle.addEventListener("pointerup", (e) => {
    if (dragY === null) return;
    const dy = e.clientY - dragY; dragY = null;
    const i = ORDER.indexOf(state.sheet);
    if (Math.abs(dy) < 8) setSheet(ORDER[(i + 1) % 3]);
    else setSheet(ORDER[Math.max(0, Math.min(2, i + (dy < 0 ? 1 : -1)))]);
  });
  handle.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setSheet(ORDER[(ORDER.indexOf(state.sheet) + 1) % 3]); } });

  // кнопки камеры
  $("#zin").addEventListener("click", () => { const v = view(); flyTo({ ...v, zoom: Math.min(19, v.zoom + 1) }, "quick"); });
  $("#zout").addEventListener("click", () => { const v = view(); flyTo({ ...v, zoom: Math.max(12, v.zoom - 1) }, "quick"); });
  $("#compass").addEventListener("click", () => { const v = view(); flyTo({ ...v, bearing: 0 }, "quick"); });
  $("#tilt").addEventListener("click", () => { const v = view(); flyTo({ ...v, pitch: v.pitch > 5 ? 0 : 50 }, "quick"); });

  // высота панели времени нужна, чтобы на телефоне кнопки камеры стояли над ней
  const setTimeH = () => document.documentElement.style.setProperty("--time-h", $("#timebar .tcard").offsetHeight + "px");
  new ResizeObserver(setTimeH).observe($("#timebar .tcard"));
  setTimeH();
  setSheet("peek");
  renderPanel();
  syncControls();
  showTime();

  // ---------- карта ----------
  let lastBearing = null;
  const needle = $("#compass svg"), tilt = $("#tilt");
  function camUI(v) {
    if (!v) return;
    if (v.bearing !== lastBearing) { lastBearing = v.bearing; needle.style.transform = `rotate(${-v.bearing}deg)`; }
    const flat = v.pitch < 5, want = flat ? "3D" : "2D";
    if (tilt.textContent !== want) { tilt.textContent = want; tilt.setAttribute("aria-label", flat ? "Наклонить карту" : "Вид сверху"); }
  }
  const tip = $("#tip");
  const tipText = (layer, o) => {
    if (layer === "bld") return `${esc(o.n || KIND[o.k] || "Здание")} · ${o.l} ${form(o.l, W_.floor)}`;
    if (layer === "roads") return esc(o.nm || ROADK[o.k] || "Улица");
    if (layer === "vp" || layer === "pads") { const v = o.v || o; return `${v.id} · ${esc(v.name)}`; }
    if (layer === "metro") return `Метро «${esc(o.n)}»`;
    if (layer === "zones") return `${o.id} · ${esc(ZN[o.id].name)}`;
    return "";
  };
  deckgl = new deck.Deck({
    parent: document.getElementById("map"),
    initialViewState: overviewState(),
    controller: { inertia: 300 },
    effects: [lighting],
    layers: layers(),
    getCursor: ({ isDragging, isHovering }) => isDragging ? "grabbing" : isHovering ? "pointer" : "grab",
    // компас и подпись 2D/3D обновляем по событию смены вида — так они не отстают от карты
    onViewStateChange: ({ viewState }) => { camUI(viewState); },
    // место из ссылки (#V2, #Z5, #route) открываем, только когда карта отрисовалась: раньше камере некуда лететь
    onLoad: () => { try { fromHash(); } catch (e) { console.warn("не удалось открыть место из ссылки", e); } },
    onHover: ({ x, y, object, layer }) => {
      const t = object && layer ? tipText(layer.id, object) : "";
      if (!t) { tip.hidden = true; return; }
      tip.innerHTML = t; tip.hidden = false;
      tip.style.left = Math.min(x + 14, innerWidth - 270) + "px"; tip.style.top = (y + 14) + "px";
    },
    onClick: ({ object, layer, coordinate }) => {
      if (!object || !layer) return;
      const id = layer.id;
      if (id === "vp" || id === "pads") pickPlace({ type: "vp", id: (object.v || object).id }, false);
      else if (id === "metro") pickPlace({ type: "st", id: object.n }, false);
      else if (id === "bld") pickPlace({ type: "bld", obj: object }, false);
      else if (id === "roads") pickPlace({ type: "road", obj: object, at: coordinate || object.p[0] }, false);
      else if (id === "zones") pickPlace({ type: "zone", id: object.id }, false);
    },
  });

  // открыть место по ссылке: #V2, #Z5, #route
  function fromHash() {
    const h = location.hash.slice(1);
    if (!HASHABLE.test(h)) return;
    if (h === "route") { if (!state.route.open) openRoute("example"); return; }
    const sel = { type: h[0] === "V" ? "vp" : "zone", id: h };
    if (!isSel(sel.type, sel.id) || state.route.open) select(sel, true);
  }
  window.addEventListener("hashchange", fromHash);

  // для автоматических проверок: где на экране окажется точка карты
  window.TWIN_PROJECT = (lngLat) => { const v = deckgl.getViewports()[0]; return v ? v.project(lngLat) : null; };
  window.TWIN_PICK = (x, y) => { const o = deckgl.pickObject({ x, y, radius: 2 }); return o ? o.layer.id : null; };
  window.TWIN_VIEW = () => view();
  window.TWIN_DEBUG = () => {
    const live = state.layers.cars ? carsAt(SC[state.scen].cars, state.t).length : 0;
    return { layers: deckgl.props.layers.map((l) => l.id), live, t: state.t };
  };
  // для снимков в отчёт: состояние без анимации
  window.TWIN_SET = (o) => {
    if (o.scen) state.scen = o.scen;
    if (o.layers) Object.assign(state.layers, o.layers);
    if (o.t !== undefined) state.t = o.t;
    if (o.playing !== undefined) state.playing = o.playing;
    if (o.sheet) setSheet(o.sheet);
    if (o.select !== undefined) { state.sel = o.select ? parseKey(o.select) : null; state.route.open = false; }
    if (o.route === "example") { exampleRoute(); state.route.open = true; }
    renderPanel(); syncControls(); showTime(); refresh();
    if (o.view === "overview") flyTo(overviewState(), "instant");
    else if (o.view === "focus") focusSel("instant");
    else if (o.view === "route") fitRoute("instant");
    else if (o.view) flyTo(o.view, "instant");
  };

  let last = performance.now();
  function tick(now) {
    const dt = (now - last) / 1000; last = now;
    if (state.playing) { state.t = (state.t + dt * 30) % 3600; showTime(); refresh(); }
    camUI(view());
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

</html>
